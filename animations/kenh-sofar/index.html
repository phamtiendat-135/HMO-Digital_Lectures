<script>window.HMO_CONFIG={"soDiemUrl":"","khoUrl":"../../"};window.HMO_NOIDUNG={"slug":"kenh-sofar","ten":"Kênh SOFAR hình thành như thế nào?","canh":[{"id":"lop-nuoc","ten":"Các lớp nước","giaiThich":"Mặt cắt cho thấy nước Biển Đông từ mặt xuống 2.000 m, chia thành các lớp nằm ngang. Màu càng đậm thì âm truyền càng chậm. Hãy để ý: lớp đậm nhất không nằm ở mặt, cũng không ở đáy, mà ở lưng chừng, quanh 1.140 m. Bảng dưới là 13 mức do một phao Argo đo ngày 22/9/2016.","bang":{"cot":["Độ sâu (m)","Nhiệt độ (°C)","ρ (kg/m³)","c (m/s)"],"dong":[["0","29,5","1.020,6","1.542,4"],["50","27,9","1.021,8","1.540,4"],["100","22,1","1.024,2","1.528,0"],["200","14,7","1.026,5","1.508,4"],["300","11,8","1.027,5","1.500,2"],["500","8,7","1.029,0","1.492,6"],["700","6,5","1.030,3","1.487,3"],["900","5,0","1.031,5","1.484,8"],["1.140","3,7","1.032,7","1.483,5"],["1.300","3,3","1.033,5","1.484,1"],["1.500","2,9","1.034,5","1.486,0"],["1.700","2,7","1.035,4","1.488,3"],["2.000","2,5","1.036,8","1.492,5"]]}},{"id":"profile","ten":"Profile tốc độ âm","giaiThich":"Mật độ nước tăng đều từ mặt xuống đáy, nhưng tốc độ âm thì không. Từ mặt xuống 1.140 m, nước lạnh dần nên âm chậm lại, từ 1.542 còn 1.483,5 m/s. Sâu hơn nữa, nhiệt độ gần như không đổi, còn áp suất tiếp tục tăng làm âm nhanh trở lại. Nơi chậm nhất gọi là trục SOFAR."},{"id":"nguon-am","ten":"Nguồn âm trên trục","giaiThich":"Ta đặt một nguồn âm ngay trên trục SOFAR. Âm lan ra mọi hướng, nhưng để dễ theo dõi, ta chỉ vẽ từng tia âm: đường đi của một phần nhỏ mặt sóng. Mỗi tia rời nguồn với một góc nghiêng khác nhau so với phương ngang. Hình dài 90 km, trục đứng phóng đại khoảng 35 lần."},{"id":"tia-4","ten":"Một tia 4°","giaiThich":"Tia rời trục chúc xuống 4°. Càng xuống, tốc độ âm càng lớn nên tia bị bẻ dần về phương ngang, nằm ngang ở 1.591 m rồi quay lên. Nước sâu nặng hơn nhưng bị nén nên “cứng” lên nhanh hơn mức nặng thêm, vì thế c vẫn tăng. Qua trục, tia gặp nước ấm hơn, âm nhanh hơn, và bị bẻ xuống ở 714 m. Thực tế tia cong đều về phía âm chậm hơn, không gãy khúc ở ranh giới lớp."},{"id":"bo-tia","ten":"Bó tia","giaiThich":"Phát thêm các tia 2°, 4°, 6° cả hướng lên lẫn hướng xuống. Tia nghiêng ít dao động hẹp quanh trục; tia nghiêng nhiều đi xa hơn mới quay đầu: tia 6° lên tới 513 m và xuống tới 1.926 m. Không tia nào chạm mặt biển hay đáy biển, nên âm gần như không mất năng lượng. Dải tô xanh chỉ là vùng các tia ≤ 6° đi qua; kênh thực rộng hơn dải này."},{"id":"tia-thoat","ten":"Tia thoát kênh","giaiThich":"Tia 18° quá dốc. Tốc độ âm ở mặt biển, 1.542 m/s, chưa đủ lớn để bẻ nó nằm ngang, nên tia chạm mặt biển sau khoảng 4 km rồi phản xạ. Mỗi lần chạm mặt hoặc đáy, âm mất bớt năng lượng. Với profile này, tia nghiêng dưới khoảng 16° bị giữ lại, tia dốc hơn thì thoát."},{"id":"tong-ket","ten":"Tổng kết","giaiThich":"Ba ý cần nhớ. Một: ở Biển Đông, tốc độ âm nhỏ nhất ở khoảng 1.140 m, đó là trục SOFAR. Hai: tia âm luôn cong về phía nước có tốc độ âm nhỏ hơn, không phải về phía nước đặc hơn. Ba: âm bị giữ quanh trục nên âm tần số thấp truyền được hàng nghìn kilômét."}],"cauHoi":[{"id":"kenh-sofar-q1","hoi":"Theo profile phao Argo trong animation, trục SOFAR ở Biển Đông nằm ở độ sâu khoảng bao nhiêu?","phuongAn":["100 m","500 m","1.140 m","2.000 m"],"dapAn":2,"giaiThich":"Tốc độ âm nhỏ nhất, 1.483,5 m/s, đo được ở 1.140 m; đó là trục kênh."},{"id":"kenh-sofar-q2","hoi":"Vì sao bên dưới trục SOFAR tốc độ âm lại tăng theo độ sâu?","phuongAn":["Vì nước ấm lên","Vì độ muối giảm mạnh","Vì áp suất tăng trong khi nhiệt độ gần như không đổi","Vì mật độ giảm"],"dapAn":2,"giaiThich":"Từ 1.140 m xuống 2.000 m nhiệt độ chỉ giảm 3,7 → 2,5 °C, còn áp suất tăng thêm khoảng 86 bar, làm c tăng từ 1.483,5 lên 1.492,5 m/s."},{"id":"kenh-sofar-q3","hoi":"Một tia âm rời trục SOFAR (c = 1.483,5 m/s) với góc 4° so với phương ngang. Tia quay đầu ở nơi tốc độ âm bằng bao nhiêu? (cos 4° = 0,99756)","phuongAn":["1.479,9 m/s","1.483,5 m/s","1.487,1 m/s","1.542,4 m/s"],"dapAn":2,"giaiThich":"Theo định luật Snell, tia

  background-size: 4px 4px;
  cursor: var(--cursor-interaction, default);
}

.form-select:not(:disabled):hover {
  background-color: color-mix(in srgb, var(--foreground) 6%, var(--secondary));
}

.form-select:focus-visible {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-check {
  display: flex;
  min-height: 20px;
  align-items: center;
  gap: 6px;
}

.form-check-input {
  appearance: none;
  width: 14px;
  height: 14px;
  flex: 0 0 auto;
  margin: 0;
  border: 1px solid var(--input);
  color: var(--primary-foreground);
  background-color: transparent;
  cursor: var(--cursor-interaction, default);
  transition:
    background-color 150ms,
    border-color 150ms,
    box-shadow 150ms;
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;] {
  border-color: var(--input);
  border-radius: var(--radius-sm);
  corner-shape: var(--corner-shape);
  background-color: var(--secondary);
  box-shadow: var(--shadow-sm);
}

.form-check:not(.form-switch)
  .form-check-input:not(:disabled):not(:checked):hover {
  background-color: var(--card);
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;]:checked {
  border-color: var(--primary);
  background-color: var(--primary);
}

.form-check:not(.form-switch)
  .form-check-input[type=&quot;checkbox&quot;]:checked::before {
  display: block;
  width: 100%;
  height: 100%;
  background: var(--primary-foreground);
  content: &quot;&quot;;
  mask: var(--checkmark-image) center / 12px 12px no-repeat;
}

.form-check-input[type=&quot;radio&quot;] {
  width: 14px;
  height: 14px;
  border-radius: var(--radius-full);
}

.form-check-input[type=&quot;radio&quot;]:checked {
  border: 2px solid var(--primary);
  background:
    radial-gradient(circle, var(--primary-foreground) 0 2.5px, transparent 3px),
    var(--primary);
}

.form-check:not(.form-switch) .form-check-input:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

.form-check:not(.form-switch) .form-check-input:disabled {
  cursor: not-allowed;
  pointer-events: none;
}

.form-check:not(.form-switch) .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
}

.form-switch .form-check-input:disabled,
.form-switch .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
  opacity: 0.6;
}

.form-check-label {
  color: var(--foreground);
  cursor: var(--cursor-interaction, default);
}

.form-switch .form-check-input {
  position: relative;
  width: 32px;
  height: 20px;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
  box-shadow: none;
  transition: background-color 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input::before {
  position: absolute;
  top: 50%;
  left: 0;
  width: 16px;
  height: 16px;
  box-sizing: border-box;

  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
  box-shadow: var(--shadow-sm);

  transform: translate(2px, -50%);

}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);
}

.form-range {
  appearance: none;
  display: block;
  width: 100%;
  height: 28px;
  flex: 1;
  margin: 0;
  padding: 0;
  outline: none;
  border: 0;

  background: linear-gradient(
      color-mix(in srgb, var(--foreground) 7%, transparent),
      color-mix(in srgb, var(--foreground) 7%, transparent)
    )
    center / 100% 2px no-repeat;
}

.form-range::-webkit-slider-runnable-track {
  height: 28px;
  background: transparent;
}

.form-range::-webkit-slider-thumb {
  appearance: none;
  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(
  [aria-pressed=&quot;true&quot;],
  [aria-selected=&quot;true&quot;],
  .is-selected
) {
  border-color: var(--primary);
  color: var(--primary-foreground);
  background: var(--primary);
}

.btn.viz-tile:is([aria-pressed=&quot;true&quot;], [aria-selected=&quot;true&quot;], .is-selected) {
  border-color: var(--primary);
  box-shadow: inset 0 0 0 1px var(--primary);
}

.btn:focus-visible,
.nav-link:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

@media (pointer: coarse) {

  .nav-link,
  .form-control,
  .form-select {
    min-width: 44px;
    min-height: 44px;
  }

  .form-control,
  .form-select {
    font-size: max(16px, var(--font-size-normal));
  }

  .form-control[type=&quot;file&quot;]::file-selector-button {
    min-width: 44px;
    min-height: 44px;
  }

  .form-control-color[type=&quot;color&quot;] {
    width: 44px;
    height: 44px;
  }

  .form-control:is(
    [type=&quot;date&quot;],
    [type=&quot;datetime-local&quot;],
    [type=&quot;month&quot;],
    [type=&quot;time&quot;],
    [type=&quot;week&quot;]
  ) {
    min-width: 0;
    max-width: 100%;
    padding-block: 8px;
  }

  .form-check {
    min-height: 44px;
    padding-inline: 15px;
  }

  .form-check-input {
    position: relative;
  }

  .form-check-input::after {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 44px;
    height: 44px;
    content: &quot;&quot;;
    transform: translate(-50%, -50%);
  }

  .form-check-label {
    display: inline-flex;
    min-width: 44px;
    min-height: 44px;
    align-items: center;
  }

  .form-range {
    height: 44px;
    touch-action: pan-y;
  }

  .form-range::-webkit-slider-runnable-track {
    height: 44px;
  }

  .form-range::-moz-range-track {
    height: 44px;
  }

  .form-range::-webkit-slider-thumb {
    margin-top: 12px;
  }
}

svg {
  display: block;
  max-width: 100%;
  height: auto;
}

#widget &gt; svg {
  width: 100%;
}

/* Model-authored chart rules can otherwise stretch icons after these styles load. */
svg.lucide {

  height: var(--icon-size) !important;
  flex: none;
  margin: 0 !important;
  stroke-width: 1.6;
}

.text-warning,
.text-destructive {
  color: var(--destructive);
}

  &lt;script&gt;
    (() =&gt; {
      const root = document.getElementById(&#x27;bao-explainer&#x27;);
      if (!root) return;
      const stages = [
        { title: &#x27;1. Biển tích nhiệt&#x27;, icon: &#x27;waves&#x27;, detail: &#x27;&lt;strong&gt;Điều kiện khởi đầu:&lt;/strong&gt; Lớp nước ấm đủ sâu làm bốc hơi mạnh, chuyển năng lượng từ đại dương vào khí quyển.&#x27; },
        { title: &#x27;2. Đối lưu phát triển&#x27;, icon: &#x27;cloud-rain-wind&#x27;, detail: &#x27;&lt;strong&gt;Phản hồi dương:&lt;/strong&gt; Hơi nước ngưng tụ trong mây, giải phóng nhiệt ẩn và làm cột khí tiếp tục bốc lên.&#x27; },
        { title: &#x27;3. Áp thấp được nuôi dưỡng&#x27;, icon: &#x27;arrow-down-to-line&#x27;, detail: &#x27;&lt;strong&gt;Chu trình khép kín:&lt;/strong&gt; Áp suất mặt biển giảm hút thêm không khí ẩm; khí thoát ra ở tầng cao duy trì dòng đi lên.&#x27; },
        { title: &#x27;4. Hoàn lưu bắt đầu xoáy&#x27;, icon: &#x27;rotate-ccw&#x27;, detail: &#x27;&lt;strong&gt;Hai chuyển động cùng lúc:&lt;/strong&gt; Không khí đi vào vùng áp thấp và bị Coriolis bẻ sang phải, tạo xoáy ngược chiều kim đồng hồ ở Bắc bán cầu.&#x27; },
        { title: &#x27;5. Bão trưởng thành&#x27;, icon: &#x27;hurricane&#x27;, detail: &#x27;&lt;strong&gt;Cấu trúc tự tổ chức:&lt;/strong&gt; Mắt bão, thành mắt và các dải mưa hình thành khi biển ấm tiếp tục cấp ẩm và đứt gió thẳng đứng còn yếu.&#x27; }
      ];
      const groups = [...root.querySelectorAll(&#x27;[data-step]&#x27;)];
      const buttons = [...root.querySelectorAll(&#x27;.steps .btn&#x27;)];
      const title = root.querySelector(&#x27;#bao-stage-title&#x27;);
      const count = root.querySelector(&#x27;#bao-stage-count&#x27;);
      const detail = root.querySelector(&#x27;#bao-detail&#x27;);
      const detailIcon = root.querySelector(&#x27;.detail i&#x27;);
      const progress = root.querySelector(&#x27;.progress&#x27;);
      const bar = root.querySelector(&#x27;.progress-bar&#x27;);
      const play = root.querySelector(&#x27;#bao-play&#x27;);
      let index = 0;
      let timer = null;

      const save = () =&gt; {
        if (window.openai &amp;&amp; window.openai.setWidgetState) {
          window.openai.setWidgetState({ modelContent: { stage: index + 1 }, privateContent: { stageIndex: index } }).catch(() =&gt; {});
        }
      };
      const setStage = (next, shouldSave = true) =&gt; {
        index = Math.max(0, Math.min(stages.length - 1, next));
        groups.forEach((group, i) =&gt; {
          group.classList.toggle(&#x27;is-active&#x27;, i === index);
          group.classList.toggle(&#x27;is-dim&#x27;, i !== index);
        });
        buttons.forEach((button, i) =&gt; {
          button.setAttribute(&#x27;aria-pressed&#x27;, String(i === index));
          button.classList.toggle(&#x27;btn-primary&#x27;, i === index);
        });
        const value = (index + 1) * 20;
        title.textContent = stages[index].title;
        count.textContent = String(index + 1).padStart(2, &#x27;0&#x27;) + &#x27; / 05&#x27;;
        detail.innerHTML = stages[index].detail;
        detailIcon.setAttribute(&#x27;data-lucide&#x27;, stages[index].icon);
        bar.style.width = value + &#x27;%&#x27;;
        progress.setAttribute(&#x27;aria-valuenow&#x27;, String(value));
        if (window.lucide) lucide.createIcons({ attrs: { width: 16, height: 16 } });
        if (shouldSave) save();
      };
      const stop = () =&gt; {
        if (timer) clearInterval(timer);
        timer = null;
        play.innerHTML = &#x27;&lt;i data-lucide=&quot;play&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;&lt;span&gt;Phát&lt;/span&gt;&#x27;;
        play.setAttribute(&#x27;aria-label&#x27;, &#x27;Phát tự động&#x27;);
        if (window.lucide) lucide.createIcons({ attrs: { width: 16, height: 16 } });
      };
      const start = () =&gt; {
        play.innerHTML = &#x27;&lt;i data-lucide=&quot;pause&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;&lt;span&gt;Tạm dừng&lt;/span&gt;&#x27;;
        play.setAttribute(&#x27;aria-label&#x27;, &#x27;Tạm dừng phát tự động&#x27;);
        if (window.lucide) lucide.createIcons({ attrs: { width: 16, height: 16 } });
        timer = setInterval(() =&gt; {
          if (index &gt;= stages.length - 1) { stop(); return; }
          setStage(index + 1);
        }, 2200);
      };
      buttons.forEach(button =&gt; button.addEventListener(&#x27;click&#x27;, () =&gt; { stop(); setStage(Number(button.dataset.index)); }));
      play.addEventListener(&#x27;click&#x27;, () =&gt; timer ? stop() : (index &gt;= stages.length - 1 ? (setStage(0), start()) : start()));

      const initial = window.openai &amp;&amp; window.openai.widgetState &amp;&amp; window.openai.widgetState.privateContent;
      if (initial &amp;&amp; Number.isInteger(initial.stageIndex)) index = initial.stageIndex;
      setStage(index, false);
      window.addEventListener(&#x27;openai:set_globals&#x27;, event =&gt; {
        const next = event.detail &amp;&amp; event.detail.globals &amp;&amp; event.detail.globals.widgetState;
        if (next &amp;&amp; next.privateContent &amp;&amp; Number.isInteger(next.privateContent.stageIndex)) setStage(next.privateContent.stageIndex, false);
      });
    })();
  &lt;/script&gt;

&lt;script&gt;
(() =&gt; {
  if (window.FloatingUIDOM == null) {
    return;
  }
  const { autoUpdate, computePosition, flip, offset, shift, size } =
